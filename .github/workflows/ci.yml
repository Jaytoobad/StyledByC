name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - prelaunch-fixes

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run typecheck:api
      - run: npm run check:api-limit
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
